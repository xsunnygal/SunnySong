[package]
name = "solmusic"
version = "0.4.2"
description = "The native SunnySong application shell"
edition = "2021"
publish = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "solmusic_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-solmusic-storage = { path = "../crates/tauri-plugin-solmusic-storage" }
solmusic-application = { path = "../crates/solmusic-application" }
solmusic-sqlite = { path = "../crates/solmusic-sqlite" }
solmusic-youtube = { path = "../crates/solmusic-youtube" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
rusqlite = "0.32"
keyring = { version = "3", features = ["linux-native-sync-persistent", "crypto-rust", "apple-native", "windows-native"] }
axum = "0.8"
tokio = { version = "1", features = ["fs", "io-util", "net", "process", "sync", "time"] }
tokio-util = { version = "0.7", features = ["io"] }
uuid = { version = "1", features = ["v4"] }
async-trait = "0.1"
async-stream = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"
lofty = "0.22"
walkdir = "2"
sha2 = "0.10"
